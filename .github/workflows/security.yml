name: Security

# A CycloneDX SBOM of the library and the third-party code it builds with
# (vendored LZ4 and KCP, libsodium; ci/sbom.py reads each version from the file
# that pins it), scanned for known vulnerabilities with Grype (a high or
# critical finding fails the run). It runs on every change and weekly, so an
# advisory published after the last commit still fails a run. The SBOM is kept
# as the run's `sbom` artifact, and a pushed tag vX.Y.Z publishes a GitHub
# Release with it attached. Locally:
#   python3 ci/sbom.py > sbom.cdx.json && grype sbom:sbom.cdx.json

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: SBOM + vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GRYPE_VERSION: 0.116.0
      GRYPE_SHA256: 40aff724297312f91ea390d003bed8d8651c74cc7f5b26732db80b3a408d2fc5
    steps:
      - uses: actions/checkout@v4
      - name: Install Grype (checksum-pinned release binary)
        run: |
          set -eu
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/grype.tar.gz" "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "$GRYPE_SHA256  $RUNNER_TEMP/grype.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$bin" grype
          echo "$bin" >> "$GITHUB_PATH"
      - name: SBOM (CycloneDX 1.6)
        run: python3 ci/sbom.py > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
      - name: Grype
        run: grype sbom:sbom.cdx.json -o table --fail-on high

  # A pushed tag vX.Y.Z gets a GitHub Release: its CHANGELOG section as the
  # notes, and the SBOM above attached as <repository>-X.Y.Z.cdx.json. It runs
  # only after the SBOM job passed, so a release never ships with a known high
  # or critical vulnerability. A release that already exists gets the SBOM
  # replaced.
  release:
    name: GitHub Release with the SBOM
    needs: sbom
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sbom
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -eu
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::not a release tag: $TAG"; exit 1 ;;
          esac
          ver=${TAG#v}
          # The section under "## [X.Y.Z]" or "## X.Y.Z", without link references.
          awk -v v="$ver" '
            BEGIN { gsub(/\./, "\\.", v); h = "^## \\[?" v "\\]?( |$)" }
            /^## / { if (on) exit; if ($0 ~ h) { on = 1; next } }
            on && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $ver"; exit 1
          fi
          asset="$REPO_NAME-$ver.cdx.json"
          cp sbom.cdx.json "$asset"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --clobber
          else
            gh release create "$TAG" "$asset" --verify-tag \
              --title "$REPO_NAME $ver" --notes-file notes.md
          fi
